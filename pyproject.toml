[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shotwolf"
version = "0.1.0"
description = "Official Python SDK for the ShotWolf screenshot, mockup, OG image, HTML-to-PDF and visual-diff API."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ShotWolf", email = "hello@shotwolf.com" }]
keywords = [
    "screenshot",
    "screenshot-api",
    "html-to-pdf",
    "og-image",
    "open-graph",
    "device-mockup",
    "visual-regression",
    "playwright",
    "shotwolf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://shotwolf.com"
Documentation = "https://shotwolf.com/docs/sdks/"
Repository = "https://github.com/shotwolf/shotwolf-python"
Issues = "https://github.com/shotwolf/shotwolf-python/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/shotwolf"]

[tool.hatch.build.targets.sdist]
include = ["src/shotwolf", "README.md", "LICENSE"]
