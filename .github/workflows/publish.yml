name: Publish to PyPI

# Publishes on any pushed tag like v0.1.0. Set a PyPI API token as the repo
# secret PYPI_API_TOKEN (or switch to trusted publishing / OIDC).
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip build pytest

      - run: pip install -e .

      - run: pytest -q

      - name: Verify tag matches project version
        run: |
          VER=$(python -c "import shotwolf; print(shotwolf.__version__)")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$VER" != "$TAG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $VER" >&2
            exit 1
          fi

      - run: python -m build

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
